<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0d" />
  <meta name="lifeos" content="app" />
  <!-- Security: only run this app's own scripts; no inline scripts, no injected handlers, no javascript: links.
       Network only to Supabase (sync) and the news APIs. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co https://hn.algolia.com https://dev.to; worker-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="description" content="Life OS: an ADHD-friendly personal operating system for focus, habits, energy and tasks." />
  <!-- installable on iPhone (Share → Add to Home Screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Life OS" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <title>Life OS</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=16" />
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="sync-config.js?v=16"></script>
  <script src="js/store.js?v=16"></script>
  <script src="js/fx.js?v=16"></script>
  <script src="js/screen.js?v=16"></script>
  <script src="js/projects.js?v=16"></script>
  <script src="js/spirit.js?v=16"></script>
  <script src="js/news.js?v=16"></script>
  <script src="js/timelog.js?v=16"></script>
  <script src="js/calendar.js?v=16"></script>
  <script src="js/sync.js?v=16"></script>
  <script src="js/app.js?v=16"></script>
</body>
</html>
